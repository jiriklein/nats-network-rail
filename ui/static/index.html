<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK Train Movement Monitor</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            height: 100vh;
            background: #f5f5f5;
        }

        .sidebar {
            width: 400px;
            background: white;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 20px;
            background: #1a73e8;
            color: white;
        }

        .sidebar-header h1 {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .sidebar-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .search-box {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        .search-box input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .station-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .station-item {
            padding: 12px;
            margin-bottom: 8px;
            background: #f8f9fa;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .station-item:hover {
            background: #e8f0fe;
        }

        .station-item.selected {
            background: #1a73e8;
            color: white;
        }

        .station-info {
            flex: 1;
        }

        .station-name {
            font-weight: 500;
            font-size: 14px;
        }

        .station-code {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 2px;
        }

        .selected-count {
            padding: 15px;
            background: #f8f9fa;
            border-top: 1px solid #eee;
            text-align: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #1a73e8;
            color: white;
        }

        .btn-primary:hover {
            background: #1557b0;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
            margin-left: 10px;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #network {
            flex: 1;
            background: #fafafa;
            position: relative;
        }

        .network-controls {
            position: absolute;
            top: 15px;
            right: 15px;
            background: white;
            padding: 10px;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .network-controls button {
            padding: 5px 10px;
            margin: 0 5px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }

        .network-controls button:hover {
            background: #f0f0f0;
        }

        .feed-panel {
            height: 300px;
            background: white;
            border-top: 1px solid #ddd;
            display: flex;
            flex-direction: column;
        }

        .feed-header {
            padding: 15px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .feed-header h2 {
            font-size: 16px;
        }

        .status-badge {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 5px;
        }

        .status-badge.connected {
            background: #0f9d58;
        }

        .status-badge.disconnected {
            background: #ea4335;
        }

        .feed-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        .feed-item {
            padding: 8px;
            margin-bottom: 8px;
            background: #f8f9fa;
            border-left: 3px solid #1a73e8;
            border-radius: 2px;
        }

        .feed-item-time {
            color: #666;
            font-size: 11px;
        }

        .feed-item-station {
            font-weight: bold;
            color: #1a73e8;
            margin-top: 4px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        /* D3 Network Styles */
        .node {
            stroke: #fff;
            stroke-width: 2px;
            cursor: pointer;
        }

        .node.active {
            stroke: #ff9800;
            stroke-width: 3px;
        }

        .link {
            stroke: #999;
            stroke-opacity: 0.3;
            stroke-width: 2px;
        }

        .link.active {
            stroke: #4caf50;
            stroke-opacity: 0.8;
            stroke-width: 3px;
        }

        .node-label {
            font-size: 11px;
            font-weight: 500;
            fill: #333;
            text-anchor: middle;
            pointer-events: none;
            user-select: none;
        }

        .empty-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #999;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>🚂 Train Movement Monitor</h1>
            <p>Select stations to track</p>
        </div>

        <div class="search-box">
            <input type="text" id="search" placeholder="Search stations..." />
        </div>

        <div class="station-list" id="stationList">
            <div class="loading">Loading stations...</div>
        </div>

        <div class="selected-count">
            <div style="margin-bottom: 10px;">
                <strong id="selectedCount">0</strong> stations selected
            </div>
            <button class="btn btn-primary" id="subscribeBtn">Start Monitoring</button>
            <button class="btn btn-secondary" id="clearBtn">Clear All</button>
        </div>
    </div>

    <div class="main-content">
        <div id="network">
            <div class="empty-state" id="emptyState">
                <div class="empty-state-icon">🗺️</div>
                <div>Select stations to see the network</div>
            </div>
            <div class="network-controls">
                <button id="resetZoom">Reset View</button>
                <button id="toggleLabels">Hide Labels</button>
            </div>
        </div>

        <div class="feed-panel">
            <div class="feed-header">
                <h2>Live Movement Feed</h2>
                <div>
                    <span class="status-badge" id="statusBadge"></span>
                    <span id="statusText">Connecting...</span>
                </div>
            </div>
            <div class="feed-content" id="feedContent">
                <div style="color: #666;">No movements yet. Select stations and click "Start Monitoring".</div>
            </div>
        </div>
    </div>

    <script>
        let stations = [];
        let selectedStations = new Set();
        let ws = null;
        let svg = null;
        let simulation = null;
        let showLabels = true;
        let movements = new Map(); // Track movements between stations

        // Network graph data
        let graphData = {
            nodes: [],
            links: []
        };

        let STATIC = {
          nodesById: new Map(),   // id -> {id, name}
          edges: []               // [{source, target}]
        };

        // Initialize D3 network
        function initNetwork() {
            const container = document.getElementById('network');
            const width = container.clientWidth;
            const height = container.clientHeight;

            svg = d3.select('#network')
                .append('svg')
                .attr('width', width)
                .attr('height', height);

            // Add zoom behavior
            const zoom = d3.zoom()
                .scaleExtent([0.1, 4])
                .on('zoom', (event) => {
                    svg.selectAll('g').attr('transform', event.transform);
                });

            svg.call(zoom);

            // Create container groups
            svg.append('g').attr('class', 'links');
            svg.append('g').attr('class', 'nodes');
            svg.append('g').attr('class', 'labels');

            // Reset zoom button
            document.getElementById('resetZoom').addEventListener('click', () => {
                svg.transition().duration(750).call(
                    zoom.transform,
                    d3.zoomIdentity.translate(width / 2, height / 2).scale(1)
                );
            });

            // Toggle labels
            document.getElementById('toggleLabels').addEventListener('click', (e) => {
                showLabels = !showLabels;
                e.target.textContent = showLabels ? 'Hide Labels' : 'Show Labels';
                svg.selectAll('.node-label').style('opacity', showLabels ? 1 : 0);
            });
        }

        // Update network graph
        function updateNetwork() {
            if (selectedStations.size === 0) {
                document.getElementById('emptyState').style.display = 'block';
                svg.selectAll('.link').remove();
                svg.selectAll('.node').remove();
                svg.selectAll('.node-label').remove();
                return;
            }

            document.getElementById('emptyState').style.display = 'none';

            // Build graph data from selected stations and their movements
            graphData.nodes = Array.from(selectedStations).map(stanox => {
                const station = stations.find(s => s.stanox === stanox);
                return {
                    id: stanox,
                    name: station ? station.name : stanox,
                    active: false
                };
            });

            // Build links from live movements AND static file edges
            const linkSet = new Set();

            // 1) live movements
            movements.forEach((targets, source) => {
              targets.forEach(target => {
                if (selectedStations.has(source) && selectedStations.has(target)) {
                  linkSet.add(`${source}→${target}`);
                }
              });
            });

            // 2) static edges from file
            for (const e of STATIC.edges) {
              if (selectedStations.has(e.source) && selectedStations.has(e.target)) {
                linkSet.add(`${e.source}→${e.target}`);
              }
            }

            // materialize into graphData.links
            graphData.links = Array.from(linkSet, key => {
              const [source, target] = key.split('→');
              return { source, target };
            });


            // Force simulation
            const width = svg.attr('width');
            const height = svg.attr('height');

            simulation = d3.forceSimulation(graphData.nodes)
                .force('link', d3.forceLink(graphData.links).id(d => d.id).distance(150))
                .force('charge', d3.forceManyBody().strength(-400))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('collision', d3.forceCollide().radius(30));

            // Draw links
            const link = svg.select('.links')
                .selectAll('.link')
                .data(
                  graphData.links,
                  d => `${typeof d.source === 'object' ? d.source.id : d.source}-${typeof d.target === 'object' ? d.target.id : d.target}`
                )
                .join('line')
                .attr('class', 'link');

            // Draw nodes
            const node = svg.select('.nodes')
                .selectAll('.node')
                .data(graphData.nodes, d => d.id)
                .join('circle')
                .attr('class', 'node')
                .attr('r', 12)
                .attr('fill', '#1a73e8')
                .call(drag(simulation));

            // Draw labels
            const label = svg.select('.labels')
                .selectAll('.node-label')
                .data(graphData.nodes, d => d.id)
                .join('text')
                .attr('class', 'node-label')
                .attr('dy', -18)
                .text(d => d.name)
                .style('opacity', showLabels ? 1 : 0);

            // Update positions on tick
            simulation.on('tick', () => {
                link
                    .attr('x1', d => d.source.x)
                    .attr('y1', d => d.source.y)
                    .attr('x2', d => d.target.x)
                    .attr('y2', d => d.target.y);

                node
                    .attr('cx', d => d.x)
                    .attr('cy', d => d.y);

                label
                    .attr('x', d => d.x)
                    .attr('y', d => d.y);
            });
        }

        // Drag behavior
        function drag(simulation) {
            function dragstarted(event) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                event.subject.fx = event.subject.x;
                event.subject.fy = event.subject.y;
            }

            function dragged(event) {
                event.subject.fx = event.x;
                event.subject.fy = event.y;
            }

            function dragended(event) {
                if (!event.active) simulation.alphaTarget(0);
                event.subject.fx = null;
                event.subject.fy = null;
            }

            return d3.drag()
                .on('start', dragstarted)
                .on('drag', dragged)
                .on('end', dragended);
        }

        // Animate movement between stations
        function animateMovement(fromStanox, toStanox) {
            // Record this movement
            if (!movements.has(fromStanox)) {
                movements.set(fromStanox, new Set());
            }
            movements.get(fromStanox).add(toStanox);

            // Update network if both stations are selected
            if (selectedStations.has(fromStanox) && selectedStations.has(toStanox)) {
                updateNetwork();

                // Pulse the link
                setTimeout(() => {
                    svg.selectAll('.link')
                        .filter(d => d.source.id === fromStanox && d.target.id === toStanox)
                        .classed('active', true)
                        .transition()
                        .duration(2000)
                        .on('end', function() {
                            d3.select(this).classed('active', false);
                        });

                    // Pulse the nodes
                    svg.selectAll('.node')
                        .filter(d => d.id === fromStanox || d.id === toStanox)
                        .classed('active', true)
                        .transition()
                        .duration(2000)
                        .on('end', function() {
                            d3.select(this).classed('active', false);
                        });
                }, 100);
            }
        }

        // Load stations
        async function loadStations() {
            const response = await fetch('/api/stations');
            const data = await response.json();
            stations = data.stations;
            renderStations(stations);
        }

        async function loadGraph() {
          const res = await fetch('/api/graph');   // or '/static/graph.json' if you prefer
          if (!res.ok) return;
          const data = await res.json();

          // keep in memory only
          STATIC.nodesById = new Map(data.nodes.map(n => [String(n.id), { id: String(n.id), name: n.name }]));
          STATIC.edges = data.edges.map(e => ({ source: String(e.source), target: String(e.target) }));
        }


        // Render station list
        function renderStations(stationList) {
            const container = document.getElementById('stationList');
            container.innerHTML = '';

            stationList.forEach(station => {
                const div = document.createElement('div');
                div.className = 'station-item';
                if (selectedStations.has(station.stanox)) {
                    div.classList.add('selected');
                }

                div.innerHTML = `
                    <div class="station-info">
                        <div class="station-name">${station.name}</div>
                        <div class="station-code">STANOX: ${station.stanox}</div>
                    </div>
                `;

                div.onclick = () => toggleStation(station);
                container.appendChild(div);
            });

            updateSelectedCount();
        }

        // Toggle station selection
        function toggleStation(station) {
            if (selectedStations.has(station.stanox)) {
                selectedStations.delete(station.stanox);
            } else {
                selectedStations.add(station.stanox);
            }

            renderStations(stations);
            updateNetwork();
        }

        // Update selected count
        function updateSelectedCount() {
            document.getElementById('selectedCount').textContent = selectedStations.size;
        }

        // Search stations
        document.getElementById('search').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = stations.filter(s =>
                s.name.toLowerCase().includes(query) ||
                s.stanox.includes(query)
            );
            renderStations(filtered);
        });

        // Clear all selections
        document.getElementById('clearBtn').addEventListener('click', () => {
            selectedStations.clear();
            movements.clear();
            renderStations(stations);
            updateNetwork();
        });

        // WebSocket connection
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

            ws.onopen = () => {
                updateStatus(true);
                addFeedItem('Connected to server', '');
            };

            ws.onclose = () => {
                updateStatus(false);
                addFeedItem('Disconnected from server', '');
                setTimeout(connectWebSocket, 3000);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.type === 'movement') {
                    handleMovement(data);
                } else if (data.type === 'subscribed') {
                    addFeedItem(`Monitoring ${data.count} stations`, '');
                }
            };
        }

        // Handle train movement
        function handleMovement(data) {
            addFeedItem(data.station, JSON.stringify(data.data, null, 2));

            // Try to extract origin/destination for graph animation
            const msgData = data.data;
            const from = msgData.origin_stanox || msgData.from_stanox || data.stanox;
            const to = msgData.dest_stanox || msgData.to_stanox;

            if (from && to) {
                animateMovement(from, to);
            } else if (data.stanox) {
                // Just highlight the single station
                svg.selectAll('.node')
                    .filter(d => d.id === data.stanox)
                    .classed('active', true)
                    .transition()
                    .duration(1000)
                    .on('end', function() {
                        d3.select(this).classed('active', false);
                    });
            }
        }

        // Add item to feed
        function addFeedItem(title, content) {
            const feed = document.getElementById('feedContent');
            const item = document.createElement('div');
            item.className = 'feed-item';
            item.innerHTML = `
                <div class="feed-item-time">${new Date().toLocaleTimeString()}</div>
                <div class="feed-item-station">${title}</div>
                ${content ? `<pre style="margin-top: 8px; font-size: 11px;">${content}</pre>` : ''}
            `;

            feed.insertBefore(item, feed.firstChild);

            // Keep only last 50 items
            while (feed.children.length > 50) {
                feed.removeChild(feed.lastChild);
            }
        }

        // Update connection status
        function updateStatus(connected) {
            const badge = document.getElementById('statusBadge');
            const text = document.getElementById('statusText');

            if (connected) {
                badge.className = 'status-badge connected';
                text.textContent = 'Connected';
            } else {
                badge.className = 'status-badge disconnected';
                text.textContent = 'Disconnected';
            }
        }

        // Subscribe to selected stations
        document.getElementById('subscribeBtn').addEventListener('click', () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'subscribe',
                    stanox: Array.from(selectedStations)
                }));
            }
        });

        // Initialize
        initNetwork();
        loadStations();
        connectWebSocket();
        loadGraph();

        // Handle window resize
        window.addEventListener('resize', () => {
            const container = document.getElementById('network');
            svg.attr('width', container.clientWidth)
               .attr('height', container.clientHeight);
            if (simulation) {
                simulation.force('center', d3.forceCenter(container.clientWidth / 2, container.clientHeight / 2));
                simulation.alpha(0.3).restart();
            }
        });
    </script>
</body>
</html>
